<section class="auth-card" aria-labelledby="login-title">
  <p class="eyebrow">Welcome back</p>
  <h1 id="login-title">Sign in to TaskBoard</h1>
  <p class="intro">Keep your work moving, one clear task at a time.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="login-email">Email</label>
    <input id="login-email" type="email" formControlName="email" autocomplete="email" />

    <label for="login-password">Password</label>
    <input id="login-password" type="password" formControlName="password" autocomplete="current-password" />
    <small id="login-password-hint">Use the 15 to 128 character passphrase you registered.</small>

    @if (errorMessage()) {
      <p class="form-error" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="switch">New to TaskBoard? <a routerLink="/register">Create an account</a></p>
</section>

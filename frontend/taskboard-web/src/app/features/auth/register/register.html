<section class="auth-card" aria-labelledby="register-title">
  <p class="eyebrow">Start simply</p>
  <h1 id="register-title">Create your TaskBoard account</h1>
  <p class="intro">A small, focused board for the work that matters now.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <label for="register-email">Email</label>
    <input id="register-email" type="email" formControlName="email" autocomplete="email" />

    <label for="register-password">Password</label>
    <input id="register-password" type="password" formControlName="password" autocomplete="new-password" />
    <small>Choose a passphrase between 15 and 128 characters.</small>

    @if (errorMessage()) {
      <p class="form-error" role="alert">{{ errorMessage() }}</p>
    }

    <button type="submit" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Creating account…' : 'Create account' }}
    </button>
  </form>

  <p class="switch">Already registered? <a routerLink="/login">Sign in</a></p>
</section>

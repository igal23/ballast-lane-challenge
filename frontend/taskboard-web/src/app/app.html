<header class="app-header">
  <a class="brand" routerLink="/tasks" aria-label="TaskBoard home">
    <span class="brand-mark" aria-hidden="true">T</span>
    <span>TaskBoard</span>
  </a>
  <nav aria-label="Account navigation">
    @if (auth.isAuthenticated()) {
      <span class="user-email">{{ auth.currentUser()?.email }}</span>
      <button type="button" class="text-button" (click)="logout()">Log out</button>
    } @else {
      <a routerLink="/login">Sign in</a>
      <a class="nav-primary" routerLink="/register">Create account</a>
    }
  </nav>
</header>
<router-outlet />
